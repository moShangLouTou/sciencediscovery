[project]
name = "sciencediscovery-scienceflow-preparation"
version = "0.1.0"
description = "Narrow task-intake adapter to a ScienceFlow engine checkout."
requires-python = ">=3.10"
dependencies = []

# Pure adapter library: no service entry point of its own. The engine and its
